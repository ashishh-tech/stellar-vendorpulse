  <text x="72" y="218" fill="#ffffff" font-size="30" font-weight="800">28</text>
  <rect x="230" y="172" width="54" height="22" rx="11" fill="#065f46" opacity="0.6" />
  <text x="257" y="187" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">+14%</text>

  <!-- Card 2 -->
  <rect x="328" y="152" width="260" height="96" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
