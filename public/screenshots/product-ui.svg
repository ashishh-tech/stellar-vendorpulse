  <circle cx="1020" cy="34" r="5" fill="#10b981" />
  <text x="1034" y="38" fill="#e2e8f0" font-size="12" font-family="monospace">GBC5...7K8P (1,450 XLM)</text>

  <!-- Page Header -->
  <text x="48" y="112" fill="#ffffff" font-size="24" font-weight="800">Procurement Vendor Registry</text>
  <text x="48" y="132" fill="#94a3b8" font-size="13">On-chain score tracking &amp; Soroban smart contract review management</text>

  <!-- Stat Summary Cards -->
  <!-- Card 1 -->
  <rect x="48" y="152" width="260" height="96" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
