  <text x="80" y="353" fill="#64748b" font-size="11" font-weight="700">VENDOR NAME</text>
  <text x="300" y="353" fill="#64748b" font-size="11" font-weight="700">CATEGORY</text>
  <text x="500" y="353" fill="#64748b" font-size="11" font-weight="700">STATUS</text>
