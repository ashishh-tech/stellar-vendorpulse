  <line x1="64" y1="480" x2="1136" y2="480" stroke="#1e293b" stroke-width="1" />
  <circle cx="92" cy="454" r="16" fill="#7c2d12" />
  <text x="92" y="459" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">SL</text>
  <text x="120" y="454" fill="#f8fafc" font-size="14" font-weight="600">Stellar Logistics Global</text>
  <text x="120" y="469" fill="#64748b" font-size="11">ID: #002 • Added 1 week ago</text>
  <text x="300" y="459" fill="#cbd5e1" font-size="13">Supply Chain &amp; Freight</text>
  <rect x="500" y="444" width="76" height="22" rx="11" fill="#065f46" opacity="0.5" />
  <text x="538" y="459" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
  <text x="650" y="459" fill="#38bdf8" font-size="15" font-weight="800">89.8 / 100</text>
  <text x="800" y="459" fill="#cbd5e1" font-size="13">18 reviews</text>
  <rect x="960" y="444" width="130" height="26" rx="6" fill="#334155" />
  <text x="1025" y="461" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Evaluate Vendor</text>

  <!-- Row 3 -->
  <circle cx="92" cy="518" r="16" fill="#1e3a8a" />
  <text x="92" y="523" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">NT</text>
  <text x="120" y="518" fill="#f8fafc" font-size="14" font-weight="600">Nexus Tech Hardware</text>
  <text x="120" y="533" fill="#64748b" font-size="11">ID: #003 • Added 2 weeks ago</text>
  <text x="300" y="523" fill="#cbd5e1" font-size="13">Hardware Procurement</text>
  <rect x="500" y="508" width="84" height="22" rx="11" fill="#854d0e" opacity="0.5" />
  <text x="542" y="523" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">PROBATION</text>
  <text x="650" y="523" fill="#f97316" font-size="15" font-weight="800">76.5 / 100</text>
  <text x="800" y="523" fill="#cbd5e1" font-size="13">12 reviews</text>
  <rect x="960" y="508" width="130" height="26" rx="6" fill="#334155" />
  <text x="1025" y="525" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Evaluate Vendor</text>

  <!-- Footer Watermark -->
  <text x="600" y="650" fill="#475569" font-size="11" text-anchor="middle">Stellar Soroban Smart Contract Architecture • VendorPulse Production UI</text>
</svg>
