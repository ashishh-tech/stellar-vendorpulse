<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#020617; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="250" fill="#6366f1" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="300" fill="#ea580c" opacity="0.06" filter="url(#glow)" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a" opacity="0.9" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#334155" stroke-width="1" />
  
  <!-- Logo & Title -->
  <rect x="32" y="16" width="32" height="32" rx="8" fill="url(#primaryGrad)" />
  <path d="M48 22 L40 38 L46 38 L44 44 L52 28 L46 28 Z" fill="#ffffff" />
  <text x="76" y="38" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.5">VendorPulse</text>
  <rect x="190" y="24" width="90" height="20" rx="10" fill="#312e81" />
  <text x="235" y="38" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">TESTNET</text>

  <!-- Nav Links -->
  <text x="350" y="38" fill="#f8fafc" font-size="14" font-weight="600">Dashboard</text>
  <rect x="345" y="58" width="80" height="3" fill="#6366f1" rx="1.5" />
  <text x="460" y="38" fill="#94a3b8" font-size="14" font-weight="500">Analytics</text>
  <text x="560" y="38" fill="#94a3b8" font-size="14" font-weight="500">Activity Feed</text>
  <text x="670" y="38" fill="#94a3b8" font-size="14" font-weight="500">Governance</text>

  <!-- Right Wallet Button -->
