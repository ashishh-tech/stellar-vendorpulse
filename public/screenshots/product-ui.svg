  <text x="650" y="395" fill="#38bdf8" font-size="15" font-weight="800">94.2 / 100</text>
  <text x="800" y="395" fill="#cbd5e1" font-size="13">24 reviews</text>
  <rect x="960" y="380" width="130" height="26" rx="6" fill="#334155" />
  <text x="1025" y="397" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Evaluate Vendor</text>

